[project]
name = "creatorhub"
version = "0.1.0"
requires-python = ">=3.11"
description = "CreatorHub local API and image renderer"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
